
spring.application.name=vetandes-backend
server.port=8080

# CONEXION ORACLE
spring.datasource.url=jdbc:oracle:thin:@//localhost:1522/FREEPDB1
spring.datasource.username=${ORACLE_USER:VETANDES}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# CONFIGURACION JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET_BASE64}
app.jwt.expiracion-minutos=60
